name: Terraform CI/CD

on:
  push:
    branches:
      - pre-prod
      - prod

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      - name: Set Environment Path
        run: |
          if [[ "${GITHUB_REF##*/}" == "pre-prod" ]]; then
            echo "TF_DIR=envs/pre-prod" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF##*/}" == "prod" ]]; then
            echo "TF_DIR=envs/prod" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        run: terraform -chdir=$TF_DIR init

      - name: Terraform Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform Plan
        run: terraform -chdir=$TF_DIR plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/pre-prod' || github.ref == 'refs/heads/prod'
        run: terraform -chdir=$TF_DIR apply -auto-approve tfplan
