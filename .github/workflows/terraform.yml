name: Terraform & Ansible CI/CD

on:
  push:
    branches:
      - pre-prod

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      - name: Create S3 Backend Bucket
        run: |
          # Create S3 bucket for Terraform backend if it doesn't exist
          aws s3api head-bucket --bucket poc-prod-vpc-logs-709efebc --region eu-west-1 2>/dev/null || {
            echo "Creating S3 bucket: poc-prod-vpc-logs-709efebc"
            aws s3api create-bucket \
              --bucket poc-prod-vpc-logs-709efebc \
              --region eu-west-1 \
              --create-bucket-configuration LocationConstraint=eu-west-1
            
            # Enable versioning for state file safety
            aws s3api put-bucket-versioning \
              --bucket poc-prod-vpc-logs-709efebc \
              --versioning-configuration Status=Enabled
            
            # Enable server-side encryption
            aws s3api put-bucket-encryption \
              --bucket poc-prod-vpc-logs-709efebc \
              --server-side-encryption-configuration '{
                "Rules": [
                  {
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    }
                  }
                ]
              }'
            
            echo "S3 bucket created and configured successfully"
          } || {
            echo "S3 bucket poc-prod-vpc-logs-709efebc already exists"
          }

      - name: Set Environment Path
        run: |
          echo "TF_DIR=envs/pre-prod" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform -chdir=$TF_DIR init

      - name: Terraform Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform Plan
        run: terraform -chdir=$TF_DIR plan -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=$TF_DIR apply -auto-approve tfplan

      - name: Get Terraform Outputs
        run: |
          echo "Starting Terraform outputs extraction..."
          echo "Current directory: $(pwd)"
          echo "TF_DIR: $TF_DIR"
          
          terraform -chdir=$TF_DIR output -json > terraform_outputs.json
          
          echo "Terraform outputs JSON:"
          cat terraform_outputs.json
          
          # Check if the file exists and has content
          if [ ! -f terraform_outputs.json ]; then
            echo "ERROR: terraform_outputs.json file was not created"
            exit 1
          fi
          
          if [ ! -s terraform_outputs.json ]; then
            echo "ERROR: terraform_outputs.json file is empty"
            exit 1
          fi
          
          # Extract IP addresses from JSON output
          CONTROL_PLANE_IP=$(jq -r '.ec2_public_ips.value[0]' terraform_outputs.json)
          WORKER_IP=$(jq -r '.ec2_public_ips.value[1]' terraform_outputs.json)
          CONTROL_PLANE_PRIVATE_IP=$(jq -r '.ec2_private_ips.value[0]' terraform_outputs.json)
          WORKER_PRIVATE_IP=$(jq -r '.ec2_private_ips.value[1]' terraform_outputs.json)
          
          echo "Extracted IPs:"
          echo "Control Plane IP: '$CONTROL_PLANE_IP'"
          echo "Worker IP: '$WORKER_IP'"
          echo "Control Plane Private IP: '$CONTROL_PLANE_PRIVATE_IP'"
          echo "Worker Private IP: '$WORKER_PRIVATE_IP'"
          
          # Check if IPs are empty
          if [ -z "$CONTROL_PLANE_IP" ] || [ "$CONTROL_PLANE_IP" = "null" ]; then
            echo "ERROR: Control Plane IP is empty or null"
            exit 1
          fi
          
          if [ -z "$WORKER_IP" ] || [ "$WORKER_IP" = "null" ]; then
            echo "ERROR: Worker IP is empty or null"
            exit 1
          fi
          
          echo "Setting environment variables for next step..."
          echo "CONTROL_PLANE_IP=$CONTROL_PLANE_IP" >> $GITHUB_ENV
          echo "WORKER_IP=$WORKER_IP" >> $GITHUB_ENV
          echo "CONTROL_PLANE_PRIVATE_IP=$CONTROL_PLANE_PRIVATE_IP" >> $GITHUB_ENV
          echo "WORKER_PRIVATE_IP=$WORKER_PRIVATE_IP" >> $GITHUB_ENV
          
          echo "Verifying environment variables:"
          echo "CONTROL_PLANE_IP: $CONTROL_PLANE_IP"
          echo "WORKER_IP: $WORKER_IP"

      - name: Set Job Outputs
        run: |
          echo "Setting job outputs from environment variables..."
          echo "control_plane_ip=$CONTROL_PLANE_IP" >> $GITHUB_OUTPUT
          echo "worker_ip=$WORKER_IP" >> $GITHUB_OUTPUT
          echo "control_plane_private_ip=$CONTROL_PLANE_PRIVATE_IP" >> $GITHUB_OUTPUT
          echo "worker_private_ip=$WORKER_PRIVATE_IP" >> $GITHUB_OUTPUT
          
          echo "Job outputs set successfully"

  ansible:
    name: Ansible Configuration
    runs-on: ubuntu-latest
    needs: terraform
    if: needs.terraform.result == 'success'

    defaults:
      run:
        shell: bash

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Ansible Inventory
        run: |
          echo "Debug: Checking Terraform job outputs..."
          echo "control_plane_ip: '${{ needs.terraform.outputs.control_plane_ip }}'"
          echo "worker_ip: '${{ needs.terraform.outputs.worker_ip }}'"
          echo "control_plane_private_ip: '${{ needs.terraform.outputs.control_plane_private_ip }}'"
          echo "worker_private_ip: '${{ needs.terraform.outputs.worker_private_ip }}'"
          
          # Check if outputs are empty
          if [ -z "${{ needs.terraform.outputs.control_plane_ip }}" ]; then
            echo "ERROR: control_plane_ip is empty from Terraform job"
            exit 1
          fi
          
          if [ -z "${{ needs.terraform.outputs.worker_ip }}" ]; then
            echo "ERROR: worker_ip is empty from Terraform job"
            exit 1
          fi
          
          cd ansible
          echo "[controlplane]" > inventory.ini
          echo "ubuntu@${{ needs.terraform.outputs.control_plane_ip }} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          echo "" >> inventory.ini
          echo "[controlplane:vars]" >> inventory.ini
          echo "control_plane_private_ip=${{ needs.terraform.outputs.control_plane_private_ip }}" >> inventory.ini
          echo "" >> inventory.ini
          echo "[worker]" >> inventory.ini
          echo "ubuntu@${{ needs.terraform.outputs.worker_ip }} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          echo "" >> inventory.ini
          echo "[worker:vars]" >> inventory.ini
          echo "worker_private_ip=${{ needs.terraform.outputs.worker_private_ip }}" >> inventory.ini
          echo "" >> inventory.ini
          echo "[defaults]" >> inventory.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> inventory.ini
          
          echo "Ansible inventory generated:"
          cat inventory.ini

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3

      - name: Setup SSH Key
        run: |
          echo "Setting up SSH directory..."
          mkdir -p ~/.ssh
          ls -la ~/.ssh
          
          echo "Setting up SSH private key..."
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ls -la ~/.ssh/id_rsa
          
          echo "Control Plane IP: ${{ needs.terraform.outputs.control_plane_ip }}"
          echo "Worker IP: ${{ needs.terraform.outputs.worker_ip }}"
          
          echo "Adding host keys to known_hosts..."
          ssh-keyscan -H "${{ needs.terraform.outputs.control_plane_ip }}" >> ~/.ssh/known_hosts || echo "Failed to scan control plane"
          ssh-keyscan -H "${{ needs.terraform.outputs.worker_ip }}" >> ~/.ssh/known_hosts || echo "Failed to scan worker"
          
          echo "SSH setup completed"

      - name: Wait for SSH to be available
        run: |
          echo "Received IP addresses from Terraform job:"
          echo "Control Plane IP: '${{ needs.terraform.outputs.control_plane_ip }}'"
          echo "Worker IP: '${{ needs.terraform.outputs.worker_ip }}'"
          
          # Check if IPs are empty
          if [ -z "${{ needs.terraform.outputs.control_plane_ip }}" ]; then
            echo "ERROR: Control Plane IP is empty"
            exit 1
          fi
          
          if [ -z "${{ needs.terraform.outputs.worker_ip }}" ]; then
            echo "ERROR: Worker IP is empty"
            exit 1
          fi
          
          echo "Waiting for SSH to be available on instances..."
          sleep 60  # Give instances time to boot
          
          # Wait for control plane
          until ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ubuntu@"${{ needs.terraform.outputs.control_plane_ip }}" 'echo SSH ready'; do
            echo "Waiting for control plane SSH..."
            sleep 30
          done
          
          # Wait for worker
          until ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ubuntu@"${{ needs.terraform.outputs.worker_ip }}" 'echo SSH ready'; do
            echo "Waiting for worker SSH..."
            sleep 30
          done
          
          echo "All instances are SSH ready!"

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml --verbose

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/id_rsa
