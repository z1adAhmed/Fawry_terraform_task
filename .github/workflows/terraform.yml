name: Terraform & Ansible CI/CD

on:
  push:
    branches:
      - pre-prod
    paths:
      - 'envs/**'
      - 'modules/**'
      - 'ansible/**'
      - 'portfolio-app/**'
      - 'k8s-manifests/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform & Ansible
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3

      - name: Create S3 Backend Bucket
        run: |
          # Create S3 bucket for Terraform backend if it doesn't exist
          aws s3api head-bucket --bucket poc-prod-vpc-logs-709efebc --region eu-west-1 2>/dev/null || {
            echo "Creating S3 bucket: poc-prod-vpc-logs-709efebc"
            aws s3api create-bucket \
              --bucket poc-prod-vpc-logs-709efebc \
              --region eu-west-1 \
              --create-bucket-configuration LocationConstraint=eu-west-1
            
            # Enable versioning for state file safety
            aws s3api put-bucket-versioning \
              --bucket poc-prod-vpc-logs-709efebc \
              --versioning-configuration Status=Enabled
            
            # Enable server-side encryption
            aws s3api put-bucket-encryption \
              --bucket poc-prod-vpc-logs-709efebc \
              --server-side-encryption-configuration '{
                "Rules": [
                  {
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    }
                  }
                ]
              }'
            
            echo "S3 bucket created and configured successfully"
          } || {
            echo "S3 bucket poc-prod-vpc-logs-709efebc already exists"
          }

      - name: Set Environment Path
        run: |
          echo "TF_DIR=envs/pre-prod" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform -chdir=$TF_DIR init

      - name: Terraform Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform Plan
        run: terraform -chdir=$TF_DIR plan -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=$TF_DIR apply -auto-approve tfplan

      - name: Capture Terraform Outputs
        id: tf_outputs
        run: |
          # Get Terraform outputs as JSON
          terraform -chdir=$TF_DIR output -json > terraform_outputs.json
          
          # Extract IP addresses from JSON
          CONTROL_PLANE_IP=$(jq -r '.ec2_public_ips.value[0]' terraform_outputs.json)
          WORKER_IP=$(jq -r '.ec2_public_ips.value[1]' terraform_outputs.json)
          CONTROL_PLANE_PRIVATE_IP=$(jq -r '.ec2_private_ips.value[0]' terraform_outputs.json)
          WORKER_PRIVATE_IP=$(jq -r '.ec2_private_ips.value[1]' terraform_outputs.json)
          
          # Read SSH private key
          SSH_PRIVATE_KEY=$(cat modules/compute/poc-pre-prod-key.pem)
          
          # Set environment variables
          echo "CONTROL_PLANE_IP=$CONTROL_PLANE_IP" >> $GITHUB_ENV
          echo "WORKER_IP=$WORKER_IP" >> $GITHUB_ENV
          echo "CONTROL_PLANE_PRIVATE_IP=$CONTROL_PLANE_PRIVATE_IP" >> $GITHUB_ENV
          echo "WORKER_PRIVATE_IP=$WORKER_PRIVATE_IP" >> $GITHUB_ENV
          
          # Set outputs for other jobs
          echo "control_plane_ip=$CONTROL_PLANE_IP" >> $GITHUB_OUTPUT
          echo "worker_ip=$WORKER_IP" >> $GITHUB_OUTPUT
          echo "control_plane_private_ip=$CONTROL_PLANE_PRIVATE_IP" >> $GITHUB_OUTPUT
          echo "worker_private_ip=$WORKER_PRIVATE_IP" >> $GITHUB_OUTPUT
          echo "ssh_private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$SSH_PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Control Plane IP: $CONTROL_PLANE_IP"
          echo "Worker IP: $WORKER_IP"

      - name: Copy Terraform SSH Private Key
        run: |
          cp modules/compute/poc-pre-prod-key.pem private-key.pem
          cp modules/compute/poc-pre-prod-key.pem ansible/poc-pre-prod-key.pem
          chmod 600 private-key.pem
          chmod 600 ansible/poc-pre-prod-key.pem
          echo "Using Terraform-generated SSH key"

      - name: Generate Ansible Inventory
        run: |
          cd ansible
          echo "[controlplane]" > inventory.ini
          echo "cp1 ansible_host=${{ env.CONTROL_PLANE_IP }} ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          echo "" >> inventory.ini
          echo "[controlplane:vars]" >> inventory.ini
          echo "private_ip=${{ env.CONTROL_PLANE_PRIVATE_IP }}" >> inventory.ini
          echo "" >> inventory.ini
          echo "[worker]" >> inventory.ini
          echo "worker1 ansible_host=${{ env.WORKER_IP }} ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini
          echo "" >> inventory.ini
          echo "[worker:vars]" >> inventory.ini
          echo "private_ip=${{ env.WORKER_PRIVATE_IP }}" >> inventory.ini
          echo "" >> inventory.ini
          echo "[defaults]" >> inventory.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> inventory.ini
          
          echo "Ansible inventory generated:"
          cat inventory.ini

      - name: Wait for SSH to be available
        run: |
          echo "Waiting for SSH to be available on instances..."
          sleep 60  # Give instances time to boot
          
          # Wait for control plane
          until ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i private-key.pem ubuntu@${{ env.CONTROL_PLANE_IP }} 'echo SSH ready'; do
            echo "Waiting for control plane SSH..."
            sleep 30
          done
          
          # Wait for worker
          until ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i private-key.pem ubuntu@${{ env.WORKER_IP }} 'echo SSH ready'; do
            echo "Waiting for worker SSH..."
            sleep 30
          done
          
          echo "All instances are SSH ready!"

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --private-key ansible/poc-pre-prod-key.pem

    outputs:
      control_plane_ip: ${{ steps.tf_outputs.outputs.control_plane_ip }}
      worker_ip: ${{ steps.tf_outputs.outputs.worker_ip }}
      control_plane_private_ip: ${{ steps.tf_outputs.outputs.control_plane_private_ip }}
      worker_private_ip: ${{ steps.tf_outputs.outputs.worker_private_ip }}
      ssh_private_key: ${{ steps.tf_outputs.outputs.ssh_private_key }}

  deploy:
    name: Build and Deploy Portfolio App
    runs-on: ubuntu-latest
    needs: terraform
    
    env:
      AWS_REGION: eu-west-1
      ECR_REPO: 600865703207.dkr.ecr.eu-west-1.amazonaws.com/pre-prod-webapp
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-app
          push: true
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup SSH access to K3s
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          
          # Copy SSH key from Terraform outputs
          echo "${{ needs.terraform.outputs.ssh_private_key }}" > ~/.ssh/k3s-key
          chmod 600 ~/.ssh/k3s-key
          
          # Debug: Check if variables are available
          echo "Control plane IP: ${{ needs.terraform.outputs.control_plane_ip }}"
          echo "All terraform outputs:"
          echo "control_plane_ip: ${{ needs.terraform.outputs.control_plane_ip }}"
          echo "worker_ip: ${{ needs.terraform.outputs.worker_ip }}"
          echo "ssh_private_key available: ${{ needs.terraform.outputs.ssh_private_key != '' }}"
          
          # For now, use the known IP address (you can update this after the first run)
          CONTROL_PLANE_IP="54.216.208.78"
          
          # Set up SSH config for K3s control plane
          cat > ~/.ssh/config << EOF
          Host k3s-control
            HostName $CONTROL_PLANE_IP
            User ubuntu
            IdentityFile ~/.ssh/k3s-key
            StrictHostKeyChecking no
          EOF
          
          # Debug: Show the SSH config
          echo "SSH config contents:"
          cat ~/.ssh/config

      - name: Copy kubeconfig from K3s
        run: |
          # Copy kubeconfig from K3s control plane
          scp k3s-control:/etc/rancher/k3s/k3s.yaml ~/.kube/config
          sed -i "s/127.0.0.1/${{ needs.terraform.outputs.control_plane_ip }}/g" ~/.kube/config

      - name: Deploy to K3s cluster
        run: |
          # Update deployment with correct image tag
          sed -i "s|:latest|:${{ env.IMAGE_TAG }}|g" k8s-manifests/deployment.yaml
          
          # Deploy using kubectl directly
          kubectl apply -f k8s-manifests/namespace.yaml
          kubectl apply -f k8s-manifests/deployment.yaml
          kubectl apply -f k8s-manifests/service.yaml
          kubectl apply -f k8s-manifests/ingress.yaml
          
          # Wait for deployment
          kubectl wait --for=condition=available --timeout=300s deployment/portfolio-app -n portfolio
          
          # Show status
          kubectl get pods -n portfolio
          kubectl get services -n portfolio

      - name: Show deployment info
        run: |
          echo "✅ Deployment completed!"
          echo "🌐 Access your app at: http://${{ needs.terraform.outputs.control_plane_ip }}:30080"
          echo "📦 ECR Repository: ${{ env.ECR_REPO }}"
          echo "🏷️ Image Tag: ${{ env.IMAGE_TAG }}"
