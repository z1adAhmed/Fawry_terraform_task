name: Deploy Portfolio App

on:
  push:
    branches:
      - pre-prod
    paths:
      - 'k8s-manifests/**'
      - 'portfolio-app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Portfolio App
    runs-on: ubuntu-latest
    
    env:
      AWS_REGION: eu-west-1
      ECR_REPO: 600865703207.dkr.ecr.eu-west-1.amazonaws.com/pre-prod-webapp
      IMAGE_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-app
          push: true
          tags: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup SSH access to K3s
        run: |
          # Copy SSH key for K3s access
          cp modules/compute/poc-pre-prod-key.pem ~/.ssh/k3s-key
          chmod 600 ~/.ssh/k3s-key
          
          # Set up SSH config for K3s control plane
          cat > ~/.ssh/config << EOF
          Host k3s-control
            HostName 54.216.208.78
            User ubuntu
            IdentityFile ~/.ssh/k3s-key
            StrictHostKeyChecking no
          EOF

      - name: Copy kubeconfig from K3s
        run: |
          # Copy kubeconfig from K3s control plane
          scp k3s-control:/etc/rancher/k3s/k3s.yaml ~/.kube/config
          sed -i 's/127.0.0.1/54.216.208.78/g' ~/.kube/config

      - name: Deploy to K3s cluster
        run: |
          # Deploy using kubectl directly
          kubectl apply -f k8s-manifests/namespace.yaml
          kubectl apply -f k8s-manifests/deployment.yaml
          kubectl apply -f k8s-manifests/service.yaml
          kubectl apply -f k8s-manifests/ingress.yaml
          
          # Wait for deployment
          kubectl wait --for=condition=available --timeout=300s deployment/portfolio-app -n portfolio
          
          # Show status
          kubectl get pods -n portfolio
          kubectl get services -n portfolio

      - name: Show deployment info
        run: |
          echo "✅ Deployment completed!"
          echo "🌐 Access your app at: http://34.245.1.110:30080"
          echo "📦 ECR Repository: ${{ env.ECR_REPO }}"
          echo "🏷️ Image Tag: ${{ env.IMAGE_TAG }}" 